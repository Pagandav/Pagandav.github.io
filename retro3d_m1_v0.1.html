function hit(o,ray){let inv=M.inv(model(o)),a=M.point(inv,ray.o),b=M.point(inv,V.add(ray.o,ray.d)),d=V.sub(b,a),lo=-Infinity,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-8){if(a[i]<-.5||a[i]>.5)return null;continue}let t1=(-.5-a[i])/d[i],t2=(.5-a[i])/d[i];lo=Math.max(lo,Math.min(t1,t2));hi=Math.min(hi,Math.max(t1,t2));if(lo>hi)return null}let t=lo>=0?lo:hi;return t>=0?t:null}
function plane(ray,y){if(Math.abs(ray.d[1])<1e-7)return null;let t=(y-ray.o[1])/ray.d[1];return t>0?V.add(ray.o,V.mul(ray.d,t)):null}
canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);if(e.button===2){mode='orbit';drag={x:e.clientX,y:e.clientY};return}if(e.button===1){mode='pan';drag={x:e.clientX,y:e.clientY};return}if(e.button!==0)return;let ray=rayAt(e.clientX,e.clientY),best=null,dist=Infinity;for(let o of objects){let t=hit(o,ray);if(t!==null&&t<dist){dist=t;best=o}}selected=best?.id||null;refresh();if(best&&window.moveArmed){checkpoint();let p=plane(ray,best.position[1]);if(p){mode='move';drag={offset:V.sub(best.position,p),y:best.position[1]}}window.moveArmed=false;toast('移動模式已啟動：拖曳滑鼠')}else mode='select'};
canvas.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(mode==='orbit'){camera.yaw-=dx*.007;camera.pitch=Math.max(-1.45,Math.min(1.45,camera.pitch+dy*.007));drag.x=e.clientX;drag.y=e.clientY}else if(mode==='pan'){let forward=V.norm(V.sub(camera.target,eye())),right=V.norm(V.cross(forward,[0,1,0])),up=V.norm(V.cross(right,forward));camera.target=V.add(camera.target,V.add(V.mul(right,-dx*camera.dist*.0017),V.mul(up,dy*camera.dist*.0017)));drag.x=e.clientX;drag.y=e.clientY}else if(mode==='move'){let o=objects.find(o=>o.id===selected),p=plane(rayAt(e.clientX,e.clientY),drag.y);if(o&&p){o.position=V.add(p,drag.offset);o.position[1]=drag.y;inspector()}}};canvas.onpointerup=()=>{drag=null;mode=''};canvas.onpointercancel=()=>{drag=null;mode=''};canvas.onwheel=e=>{e.preventDefault();camera.dist=Math.max(1.2,Math.min(90,camera.dist*Math.exp(e.deltaY*.001)))};
window.addEventListener('keydown',e=>{let tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redo').click()}else if(e.key==='Delete')$('remove').click();else if(e.key.toLowerCase()==='g'&&selected){window.moveArmed=true;toast('移動工具：在物件上按住左鍵拖曳')}else if(e.key==='Escape'){window.moveArmed=false;toast('已取消移動工具')}});
demo();if(gl&&program)render();
